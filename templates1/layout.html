<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cover Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5efe6;
      --card-bg: #fffdf9;
      --text: #1e1815;
      --muted: #6b5e55;
      --terracotta: #a8431b;
      --terracotta-hover: #8f3815;
      --sage: #dde8df;
      --sage-dark: #2d4533;
      --border: #1e1815;
      --shadow: 4px 4px 0px #1e1815;
      --shadow-hover: 6px 6px 0px #1e1815;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      max-width: 980px;
      margin: 36px auto;
      padding: 0 24px;
      color: var(--text);
      background-color: var(--bg);
      line-height: 1.5;
    }

    /* Headings in Serif */
    h1, h2, h3, .serif {
      font-family: 'Lora', Georgia, serif;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Top Navigation */
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 700;
    }

    .brand-icon {
      width: 26px;
      height: 32px;
      background: var(--terracotta);
      border-radius: 4px;
      display: inline-block;
      position: relative;
      border: 2px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
    }
    .brand-icon::after {
      content: '';
      position: absolute;
      top: 0; left: 4px; bottom: 0; width: 3px;
      background: rgba(255,255,255,0.4);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      font-size: 0.95rem;
      padding-bottom: 4px;
      transition: color 0.15s;
    }

    nav a:hover {
      color: var(--terracotta);
    }

    nav a.active {
      color: var(--terracotta);
      font-weight: 700;
      border-bottom: 2.5px solid var(--terracotta);
    }

    /* Flash Messages */
    .flash {
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 24px;
      font-weight: 500;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
    }
    .flash.success { background: #dcfce7; color: #14532d; }
    .flash.error { background: #fee2e2; color: #7f1d1d; }

    /* Reusable Cards & Neo-Brutalist Elements */
    .neo-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
      transition: all 0.15s ease-in-out;
    }

    /* Buttons */
    .btn-terra {
      background: var(--terracotta);
      color: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn-terra:hover {
      background: var(--terracotta-hover);
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-hover);
    }

    .btn-white {
      background: #ffffff;
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn-white:hover {
      background: #fafaf9;
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-hover);
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <!-- Header / Nav -->
  <div class="header-nav">
    <a href="{{ url_for('index') }}" class="brand">
      <span class="brand-icon"></span>
      <span>Cover Pipeline</span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Studio</a>
      <a href="{{ url_for('custom') }}" class="{% if request.endpoint == 'custom' %}active{% endif %}">Custom Layout</a>
    </nav>
  </div>

  <!-- Notifications -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <!-- Page Content -->
  {% block content %}{% endblock %}
</body>
</html>
